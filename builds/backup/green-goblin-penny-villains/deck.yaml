upgrades:
  - add:
      name: 'Thrill of Possibility'
      quantity: 1
    cut:
      name: 'Vision of Love'
      quantity: 1
    reason: 'Vision of Love now costs $1.03 at its cheapest and fails max_card_price. Thrill is the same discard-for-two at instant speed.'
  - add:
      name: 'Big Score'
      quantity: 1
    cut:
      name: "Night's Whisper"
      quantity: 1
    reason: 'Instant draw two that also discards (mayhem/madness enabler) and makes two Treasures for Mayhem Devil.'
  - add:
      name: 'Rakdos Signet'
      quantity: 1
    cut:
      name: "Racers' Scoreboard"
      quantity: 1
    reason: 'The deck has only two ramp pieces. A two-mana rock beats a four-mana card that rarely reaches max speed.'
  - add:
      name: 'Talisman of Indulgence'
      quantity: 1
    cut:
      name: 'Swamp'
      quantity: 1
    reason: 'Second two-mana rock. With Signet and the commander Treasures, 21 lands is enough.'
  - add:
      name: 'Dragonskull Summit'
      quantity: 1
    cut:
      name: 'Ominous Asylum'
      quantity: 1
    reason: 'Usually enters untapped with 15 basics. The surveil ability on Asylum is too expensive to matter.'
  - add:
      name: 'Foreboding Ruins'
      quantity: 1
    cut:
      name: 'Stingerquill Annex'
      quantity: 1
    reason: 'Stingerquill always enters tapped here (no planeswalkers). Foreboding Ruins usually enters untapped.'
  - add:
      name: 'Smoldering Marsh'
      quantity: 1
    cut:
      name: 'Mountain'
      quantity: 1
    reason: 'Untapped dual once two basics are out, which this mana base nearly always has.'
  - add:
      name: 'Moonstone, Harsh Mistress'
      quantity: 1
    cut:
      name: 'Spider-Islanders'
      quantity: 1
    reason: 'A Villain flyer that turns every upkeep discard into card advantage (play the discarded card until the end of next turn).'
  - add:
      name: 'Containment Construct'
      quantity: 1
    cut:
      name: 'Merciless Enforcers'
      quantity: 1
    reason: 'Two-mana engine that lets you play the card the commander makes you discard.'
  - add:
      name: 'Archfiend of Ifnir'
      quantity: 1
    cut:
      name: 'Venom, Evil Unleashed'
      quantity: 1
    reason: 'Every discard shrinks the opposing board, a repeatable one-sided sweeper with this commander.'
  - add:
      name: 'Dying to Serve'
      quantity: 1
    cut:
      name: 'Tether Technician'
      quantity: 1
    reason: 'Three mana for a 2/2 every turn off the upkeep discard, instead of a five-mana one-shot ping.'
  - add:
      name: 'Lightning Axe'
      quantity: 1
    cut:
      name: 'Heated Debate'
      quantity: 1
    reason: 'One mana for 5 damage, and the discard cost feeds madness and mayhem.'
  - add:
      name: 'Fiery Temper'
      quantity: 1
    cut:
      name: 'Lightning Strike'
      quantity: 1
    reason: 'Same 3 damage to any target, but castable for {R} when discarded to the commander.'
  - add:
      name: 'Terminate'
      quantity: 1
    cut:
      name: "Bilbo's Deadly Slice"
      quantity: 1
    reason: 'Unconditional instant kill spell one mana cheaper.'
  - add:
      name: "Kolaghan's Command"
      quantity: 1
    cut:
      name: 'Ichor Slick'
      quantity: 1
    reason: 'Flexible two-for-one: regrow a creature, shock, kill an artifact or make an opponent discard.'
  - add:
      name: 'Blasphemous Act'
      quantity: 1
    cut:
      name: 'Dark Withering'
      quantity: 1
    reason: "A real board wipe to back up Sandman's Quicksand. The deck already has plenty of spot removal."
  - add:
      name: 'Faithless Looting'
      quantity: 1
    cut:
      name: 'Hallway Heckler'
      quantity: 1
    reason: 'One-mana rummage twice (with flashback). It puts two mayhem/madness cards in play on a single turn.'
playtests: []
