primer: 60-card Commander with every card at $1 or less (cheapest printing). Flood the board with cheap Elves; each one entering makes Maralen exile two cards from an opponent's library, and once a turn you cast one of them free if its mana value is at most your Elf and Faerie count. Thranduil's anthem and landfall tokens plus Thranduil's Company turn the wide board into the win.
power_notes: Bracket 2. No Game Changers, no tutors beyond basic lands, no infinite combos.
