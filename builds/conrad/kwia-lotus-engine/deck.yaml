considered:
  - name: 'Bag End Banquet'
    reason: 'With Peregrin and Bilbo it enters as four Food and three Treasure, but at six mana it competes with Kwia on the curve, the deck has plenty of late mana, and its tap ability shrinks as Food is sacrificed for life.'
  - name: 'Thought Vessel'
    reason: 'A colorless two-mana rock; the deck already has Sol Ring and Arcane Signet, its double-white and green costs want colored mana, and it rarely needs the hand size.'
  - name: "Commander's Sphere"
    reason: 'A three-mana rock comes too late to speed up Kwia; the ramp is built from one- and two-mana pieces.'
  - name: 'Relic of Legends'
    reason: "A three-mana rock, too slow for the same reason as Commander's Sphere, even with the deck's legendary creatures."
  - name: 'Explore'
    reason: 'Needs a land in hand to ramp; the deck prefers ramp that fetches lands or stays as a dork.'
  - name: 'Springleaf Drum'
    reason: 'Turns a creature into mana rather than adding a source, and the deck has few creatures before turn three.'
  - name: 'Millikin'
    reason: 'Colorless creature mana that is worse than the green dorks the deck already runs.'
  - name: "Archaeomancer's Map"
    reason: 'Two Plains to hand is card advantage, not mana the turn it lands; fifteen faster ramp pieces are in already.'
  - name: 'Aftermath Analyst'
    reason: 'Land recursion with little to return: only Evolving Wilds and Ash Barrens put lands in the graveyard.'
  - name: 'Inspiring Call'
    reason: 'The baseline puts few +1/+1 counters on creatures; revisit if the Heliod and Archangel of Thune upgrades go in.'
  - name: 'Whispersilk Cloak'
    reason: 'Kwia already flies and has ward {2}; Swiftfoot Boots and Lightning Greaves protect it for less and grant haste.'
  - name: 'Darksteel Plate'
    reason: 'Indestructible does not stop exile, bounce or Hour of Reckoning-style sacrifice effects, and the equip cost competes with the Boots and Greaves.'
  - name: 'Forge Anew'
    reason: 'Only Swiftfoot Boots and Lightning Greaves are Equipment, so it has nothing to work with.'
  - name: 'Wall of Omens'
    reason: 'A cantrip body like Tataru Taru, but a defender can not attack with Strength of the Pack or Rabbit Response, and it makes no Treasure.'
  - name: 'Cut a Deal'
    reason: 'Close call: three cards for three mana in a four-player game, and the opponents drawing on your turn triggers Tataru Taru, but it gives each opponent a card; Rent Is Due and the Food draws are repeatable.'
  - name: "Hunter's Insight"
    reason: 'Needs one big attacker to connect; the go-wide plan does not guarantee that before its finishers resolve.'
  - name: 'Requisition Raid'
    reason: 'Close call: flexible artifact and enchantment removal that can also put a counter on each of your creatures, but Pest Infestation and the four exile enchantments cover those targets.'
  - name: 'Coveted Jewel'
    reason: 'Six mana, and any opponent who attacks you unblocked takes it and draws three cards.'
  - name: 'Lithoform Engine'
    reason: "Copying Kwia's Lotus trigger costs two mana to gain three, a slow return on a four-mana artifact."
upgrades:
  - add:
      name: 'Craterhoof Behemoth'
      quantity: 1
      role: wincon
    cut:
      name: 'Rabbit Response'
      quantity: 1
    reason: 'The best go-wide finisher in green: haste, trample and +X/+X for every creature, turning the token board into a one-turn kill. Lotus mana makes eight mana easy.'
  - add:
      name: 'Heliod, Sun-Crowned'
      quantity: 1
      role: synergy,wincon
    cut:
      name: 'Hop to It'
      quantity: 1
    reason: 'Every lifegain trigger also grows a creature, and with Walking Ballista it is a two-card infinite (give Ballista lifelink, ping, gain life, add a counter). Bracket 4 allows it.'
  - add:
      name: 'Walking Ballista'
      quantity: 1
      role: removal,wincon
    cut:
      name: 'Your Fate Ends Here'
      quantity: 1
    reason: "Flexible removal that scales with Lotus mana, and Heliod's combo partner. It replaces the narrowest removal spell: three mana, and only for creatures and planeswalkers of mana value 3 or more."
  - add:
      name: 'Birds of Paradise'
      quantity: 1
      role: ramp
    cut:
      name: 'Goobbue Gardener'
      quantity: 1
    reason: 'One-mana dork for any color instead of a two-mana mono-green one; your only copy is in a protected precon.'
  - add:
      name: 'Llanowar Elves'
      quantity: 1
      role: ramp
    cut:
      name: 'Undercover Skrull'
      quantity: 1
    reason: 'Turn-one ramp toward a turn-three Kwia; cheapest dork in the format.'
  - add:
      name: 'Elvish Mystic'
      quantity: 1
      role: ramp
    cut:
      name: 'Wood Elves'
      quantity: 1
    reason: 'Another one-drop dork; a lower curve matters more than a three-mana land at this power level.'
  - add:
      name: 'Path to Exile'
      quantity: 1
      role: removal
    cut:
      name: 'Make Your Move'
      quantity: 1
    reason: 'One-mana instant exile for any creature instead of a conditional three-mana answer. Your copies are in protected precons.'
  - add:
      name: 'Beast Within'
      quantity: 1
      role: removal
    cut:
      name: 'Darksteel Mutation'
      quantity: 1
    reason: 'Instant answer to any permanent, not just creatures.'
  - add:
      name: 'Essence Warden'
      quantity: 1
      role: synergy
    cut:
      name: 'Resolute Reinforcements'
      quantity: 1
    reason: "One-mana lifegain on every creature entering, on any player's turn, so Kwia makes a Lotus nearly every turn."
  - add:
      name: 'Soul Warden'
      quantity: 1
      role: synergy
    cut:
      name: 'Rent Is Due'
      quantity: 1
    reason: 'Second copy of the Essence Warden effect for redundant every-turn Lotus triggers.'
  - add:
      name: 'Academy Manufactor'
      quantity: 1
      role: synergy
    cut:
      name: 'Chocobo Racetrack'
      quantity: 1
    reason: 'Every Food or Treasure becomes a Food, a Treasure and a Clue; with Peregrin and Bilbo each token turns into a pile of mana, lifegain and cards.'
  - add:
      name: 'Tireless Provisioner'
      quantity: 1
      role: ramp,synergy
    cut:
      name: 'Flowering of the White Tree'
      quantity: 1
    reason: 'Each land drop makes a Treasure or a Food, so it ramps and feeds instant-speed lifegain.'
  - add:
      name: 'Avenger of Zendikar'
      quantity: 1
      role: wincon
    cut:
      name: 'Dancing from Dark to Dawn'
      quantity: 1
    reason: 'A board of Plants that grow with every land drop; wins alongside Craterhoof or Strength of the Pack.'
  - add:
      name: 'Heroic Intervention'
      quantity: 1
      role: protection
    cut:
      name: 'Bite Down'
      quantity: 1
    reason: 'Instant-speed answer to a board wipe or targeted removal for the whole board.'
  - add:
      name: "Nature's Lore"
      quantity: 1
      role: ramp
    cut:
      name: 'Three Tree Rootweaver'
      quantity: 1
    reason: 'Two-mana land ramp in place of a two-mana dork: the land survives Hour of Reckoning, Settle the Wreckage and opposing wipes, and the dork upgrades already supply the early creature mana.'
  - add:
      name: 'Three Visits'
      quantity: 1
      role: ramp
    cut:
      name: 'Courier of Comestibles'
      quantity: 1
    reason: "Same as Nature's Lore; more early ramp means an earlier Kwia."
  - add:
      name: 'Canopy Vista'
      quantity: 1
      role: land
    cut:
      name: 'Path of Ancestry'
      quantity: 1
    reason: 'Green-white dual that usually enters untapped with basics, instead of a tapped land whose scry rarely triggers.'
  - add:
      name: 'Sunpetal Grove'
      quantity: 1
      role: land
    cut:
      name: 'Ash Barrens'
      quantity: 1
    reason: 'Untapped green-white dual instead of a colorless land that needs mana to fix.'
  - add:
      name: 'Archangel of Thune'
      quantity: 1
      role: synergy,wincon
    cut:
      name: 'Entish Restoration'
      quantity: 1
    reason: 'Flying lifelinker that puts a counter on every creature you control each time you gain life; with every-turn lifegain it grows the whole token board. The deck has plenty of ramp after the dork upgrades.'
  - add:
      name: 'Generous Gift'
      quantity: 1
      role: removal
    cut:
      name: 'Liminal Hold'
      quantity: 1
    reason: 'Two-mana instant answer to any permanent instead of a four-mana sorcery-speed enchantment that can be undone.'
  - add:
      name: 'Temple Garden'
      quantity: 1
      role: land
    cut:
      name: 'Hobbit Hole'
      quantity: 1
    reason: 'Untapped green-white dual that Three Visits can fetch (it is a Forest), instead of a land that sacrifices itself for a tapped basic.'
  - add:
      name: 'Brushland'
      quantity: 1
      role: land
    cut:
      name: 'Surveillance Room'
      quantity: 1
    reason: 'Untapped green-white source instead of a colorless land that costs {1} to fix.'
playtests:
  - date: '2026-11-02'
    notes: >-
      Not a playtest: a list review. Tome of Legends rarely gains page counters with a six-mana commander, while Gleaming Splendor is a cheaper repeatable draw outlet. Activated on an opponent's turn after their draw, targeting yourself and them, it draws a card and makes a Treasure, which Peregrin Took and Bilbo turn into Food and more Treasure. The Nature's Lore upgrade now cuts Three Tree Rootweaver.
    changes: '-Tome of Legends, +Gleaming Splendor'
  - date: '2026-11-02'
    notes: >-
      Not a playtest: a review of the strongest left-out cards (deck:candidates). Tataru Taru replaces Gallant Citizen: the same two-mana cantrip body, plus a Treasure once each turn when an opponent draws off their turn, which Gleaming Splendor's ability and Tataru's own enter trigger can cause. The Walking Ballista upgrade now cuts Your Fate Ends Here. The other top-20 cards and Bag End Banquet are recorded in considered.
    changes: '-Gallant Citizen, +Tataru Taru'
  - date: '2026-11-02'
    notes: >-
      Not a playtest: two more swaps from the deck:candidates review. Bastion Protector makes Kwia indestructible, so it survives the deck's own Hour of Reckoning; Lightning Greaves goes, since its shroud stops the deck's own protection spells and Swiftfoot Boots stays. Defense of the Heart usually triggers in a four-player game and puts two creatures such as Ghalta and Verdant Kraken, or Peregrin and Bilbo, onto the battlefield; Pictures of Spider-Man goes, as the weaker way to find creatures.
    changes: '-Lightning Greaves, +Bastion Protector, -Pictures of Spider-Man, +Defense of the Heart'
