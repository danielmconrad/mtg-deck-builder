unlimited_basics: true
primer: >-
  Selesnya Food-and-tokens ramp. Accelerate into Kwia on turn three or four with dorks, rocks and land ramp, then gain life on every player's turn (Food sacrificed at instant speed, Squirrel Nest and flash tokens feeding Liliana, Daxos and Belladonna, Essence Warden, Authority of the Consuls, Verdant Kraken's upkeep Tentacles) so Kwia makes a Lotus each turn, and Archangel of Thune puts a counter on every creature with each life gain. Peregrin Took turns every Lotus and token into an extra Food and Bilbo turns every Food into a Treasure, so the engine snowballs into mana, cards (Peregrin, Rent Is Due, Belladonna, Elven Chorus) and a wide board. Win by going wide and casting Strength of the Pack, Rabbit Response, Champions from Beyond or Garruk, or a cheap Ghalta, with Kwia flying over for lifelink damage; asymmetric wipes (Hour of Reckoning, Settle the Wreckage) and eleven spot removal spells keep the table in check. Seedborn Muse untaps everything on each opponent's turn, so the deck has full mana to sacrifice Food, tap Squirrel Nest and activate Gleaming Splendor on every turn.
power_notes: >-
  Plays like Bracket 3 (Upgraded), near its top end: Sol Ring, fourteen ramp pieces (Nature's Lore now in place of Farseek) and the Lotus engine put Kwia out on turn three or four and snowball from there. Built only from owned, unprotected cards. Its one Game Changer, Seedborn Muse, sets the lowest legal bracket at 3 (Bracket 3 allows up to three), and it has no mass land denial, extra turns or two-card infinite combos. Seedborn pushes it further toward the top of Bracket 3, since the Lotus engine now runs at full speed on every opponent's turn. Pulls from the binders and from the three built custom decks (Kwia's Canopy, Bifur, Edgar), so building it dismantles parts of those. The One Ring, plus staples like Birds of Paradise, Heroic Intervention and the Selesnya duals other than Canopy Vista and Sunpetal Grove, are only in protected collections. Caution on upgrades: Heliod, Sun-Crowned with Walking Ballista is a two-card infinite, which Bracket 3 forbids before turn six; agree on it with the table or swap one of them out before applying the upgrades.
