considered:
  - name: 'Cultivate'
    reason: "Three-mana ramp that puts its land onto the battlefield tapped, so it comes too late to speed up a turn-three Kwia. The deck already has fourteen ramp pieces, mostly at one and two mana, including Nature's Lore and Rampant Growth."
  - name: 'Ghostly Prison'
    reason: 'Taxes attacks on you, but it neither gains life nor makes tokens, so it does nothing for the Lotus engine; the slot goes to ramp and lifegain.'
  - name: 'Welcoming Vampire'
    reason: 'Draws once a turn off small tokens, but it gains no life, and the deck already draws through Peregrin Took, Rent Is Due, Belladonna and Elven Chorus.'
  - name: 'Faeburrow Elder'
    reason: 'In a two-color deck it taps for only two mana, and as a three-mana dork it comes too late. The deck already runs fourteen ramp pieces, mostly at one and two mana.'
  - name: 'Mangara, the Diplomat'
    reason: 'Draws only when opponents attack you or cast a second spell, and it gains life only when it deals damage, so it seldom triggers Kwia; at four mana it competes with Kwia on the curve.'
  - name: 'Vanquish the Horde'
    reason: "A symmetric wipe that destroys the deck's own token board; Hour of Reckoning and Settle the Wreckage clear the table while sparing it."
  - name: 'Crashing Drawbridge'
    reason: 'Gives the board haste, but the deck wins with pump finishers like Strength of the Pack and Rabbit Response on tokens that are already in play, and the Drawbridge does nothing else.'
  - name: 'Arasta of the Endless Web'
    reason: 'Makes tokens only when opponents cast instants or sorceries, and it gains no life, so it does little for the Lotus engine.'
  - name: 'Bag End Banquet'
    reason: 'With Peregrin and Bilbo it enters as four Food and three Treasure, but at six mana it competes with Kwia on the curve, the deck has plenty of late mana, and its tap ability shrinks as Food is sacrificed for life.'
  - name: 'Thought Vessel'
    reason: 'A colorless two-mana rock; the deck already has Sol Ring and Arcane Signet, its double-white and green costs want colored mana, and it rarely needs the hand size.'
  - name: "Commander's Sphere"
    reason: 'A three-mana rock comes too late to speed up Kwia; the ramp is built from one- and two-mana pieces.'
  - name: 'Relic of Legends'
    reason: "A three-mana rock, too slow for the same reason as Commander's Sphere, even with the deck's legendary creatures."
  - name: 'Explore'
    reason: 'Needs a land in hand to ramp; the deck prefers ramp that fetches lands or stays as a dork.'
  - name: 'Springleaf Drum'
    reason: 'Turns a creature into mana rather than adding a source, and the deck has few creatures before turn three.'
  - name: 'Millikin'
    reason: 'Colorless creature mana that is worse than the green dorks the deck already runs.'
  - name: "Archaeomancer's Map"
    reason: 'Two Plains to hand is card advantage, not mana the turn it lands; fifteen faster ramp pieces are in already.'
  - name: 'Aftermath Analyst'
    reason: 'Land recursion with little to return: only Evolving Wilds puts a land in the graveyard.'
  - name: 'Inspiring Call'
    reason: 'Archangel of Thune is the only card that spreads +1/+1 counters, so it draws well only while she is on the battlefield; revisit if the Heliod upgrade goes in.'
  - name: 'Whispersilk Cloak'
    reason: 'Kwia already flies and has ward {2}; Swiftfoot Boots protects it for less and grants haste.'
  - name: 'Darksteel Plate'
    reason: 'Indestructible does not stop exile, bounce or Hour of Reckoning-style sacrifice effects, and the equip cost competes with Swiftfoot Boots.'
  - name: 'Forge Anew'
    reason: 'Swiftfoot Boots is the only Equipment, so it has nothing to work with.'
  - name: 'Lightning Greaves'
    reason: 'Swapped out for Bastion Protector. Its shroud also stops the deck from targeting the equipped creature with Snakeskin Veil and Vigorbloom Charm, while Swiftfoot Boots gives the same haste with hexproof, which those spells get through.'
  - name: 'Satyr Wayfinder'
    reason: "It puts a land into your hand rather than onto the battlefield, so it smooths draws without ramping toward a turn-three or four Kwia, and the three cards it puts in the graveyard feed only Undercover Skrull and Battle Screech's flashback."
  - name: 'Wall of Omens'
    reason: 'A cantrip body like Tataru Taru, but a defender can not attack with Strength of the Pack or Rabbit Response, and it makes no Treasure.'
  - name: 'Cut a Deal'
    reason: 'Close call: three cards for three mana in a four-player game, and the opponents drawing on your turn triggers Tataru Taru, but it gives each opponent a card; Rent Is Due and the Food draws are repeatable.'
  - name: "Hunter's Insight"
    reason: 'Needs one big attacker to connect; the go-wide plan does not guarantee that before its finishers resolve.'
  - name: 'Requisition Raid'
    reason: 'Close call: flexible artifact and enchantment removal that can also put a counter on each of your creatures, but Pest Infestation and the four exile enchantments cover those targets.'
  - name: 'Coveted Jewel'
    reason: 'Six mana, and any opponent who attacks you unblocked takes it and draws three cards.'
  - name: 'Lithoform Engine'
    reason: "Copying Kwia's Lotus trigger costs two mana to gain three, a slow return on a four-mana artifact."
  - name: Entish Restoration
    reason: 'Swapped out for Archangel of Thune: with every-turn lifegain the Archangel grows the whole token board, and the deck keeps fourteen ramp pieces without it.'
  - name: Resolute Reinforcements
    reason: Swapped out for Essence Warden, which gains life on any player's turn for one mana so Kwia makes a Lotus nearly every turn; Reinforcements makes only one token.
  - name: Darksteel Mutation
    reason: Swapped out for Beast Within, an instant answer to any permanent rather than a sorcery-speed creature-only one.
  - name: Path of Ancestry
    reason: Swapped out for Canopy Vista, a green-white dual that usually enters untapped; Path of Ancestry enters tapped and its scry rarely triggers.
  - name: Ash Barrens
    reason: Swapped out for Sunpetal Grove, an untapped green-white dual instead of a colorless land that costs mana to fix.
  - name: Three Tree Rootweaver
    reason: 'Swapped out for Farseek: two-mana land ramp whose Plains survives Hour of Reckoning, Settle the Wreckage and opposing wipes, where the dork does not.'
  - name: Farseek
    reason: "Swapped out for Nature's Lore: the same two-mana land ramp, but the land enters untapped and can be a Forest or a Plains."
  - name: Make Your Move
    reason: 'Swapped out for Path to Exile: one-mana instant exile for any creature instead of a conditional three-mana answer.'
  - name: Web Up
    reason: "Swapped out for Seedborn Muse: Web Up has the same text as Memory Trap and removal was over the template at 14, while Seedborn untaps every mana source on each opponent's turn so the deck can crack Food and gain life on every turn."
upgrades:
  - add:
      name: 'Craterhoof Behemoth'
      quantity: 1
      role: wincon
    cut:
      name: 'Rabbit Response'
      quantity: 1
    reason: 'The best go-wide finisher in green: haste, trample and +X/+X for every creature, turning the token board into a one-turn kill. Lotus mana makes eight mana easy.'
  - add:
      name: 'Heliod, Sun-Crowned'
      quantity: 1
      role: synergy,wincon
    cut:
      name: 'Hop to It'
      quantity: 1
    reason: 'Every lifegain trigger also grows a creature, and with Walking Ballista it is a two-card infinite (give Ballista lifelink, ping, gain life, add a counter). Bracket 4 allows it.'
  - add:
      name: 'Walking Ballista'
      quantity: 1
      role: removal,wincon
    cut:
      name: 'Your Fate Ends Here'
      quantity: 1
    reason: "Flexible removal that scales with Lotus mana, and Heliod's combo partner. It replaces the narrowest removal spell: three mana, and only for creatures and planeswalkers of mana value 3 or more."
  - add:
      name: 'Birds of Paradise'
      quantity: 1
      role: ramp
    cut:
      name: 'Goobbue Gardener'
      quantity: 1
    reason: 'One-mana dork for any color instead of a two-mana mono-green one; your only copy is in a protected precon.'
  - add:
      name: 'Llanowar Elves'
      quantity: 1
      role: ramp
    cut:
      name: 'Undercover Skrull'
      quantity: 1
    reason: 'Turn-one ramp toward a turn-three Kwia; cheapest dork in the format.'
  - add:
      name: 'Elvish Mystic'
      quantity: 1
      role: ramp
    cut:
      name: 'Wood Elves'
      quantity: 1
    reason: 'Another one-drop dork; a lower curve matters more than a three-mana land at this power level.'
  - add:
      name: 'Soul Warden'
      quantity: 1
      role: synergy
    cut:
      name: 'Rent Is Due'
      quantity: 1
    reason: 'Second copy of the Essence Warden effect for redundant every-turn Lotus triggers.'
  - add:
      name: 'Academy Manufactor'
      quantity: 1
      role: synergy
    cut:
      name: 'Chocobo Racetrack'
      quantity: 1
    reason: 'Every Food or Treasure becomes a Food, a Treasure and a Clue; with Peregrin and Bilbo each token turns into a pile of mana, lifegain and cards.'
  - add:
      name: 'Tireless Provisioner'
      quantity: 1
      role: ramp,synergy
    cut:
      name: 'Flowering of the White Tree'
      quantity: 1
    reason: 'Each land drop makes a Treasure or a Food, so it ramps and feeds instant-speed lifegain.'
  - add:
      name: 'Avenger of Zendikar'
      quantity: 1
      role: wincon
    cut:
      name: 'Dancing from Dark to Dawn'
      quantity: 1
    reason: 'A board of Plants that grow with every land drop; wins alongside Craterhoof or Strength of the Pack.'
  - add:
      name: 'Heroic Intervention'
      quantity: 1
      role: protection
    cut:
      name: 'Bite Down'
      quantity: 1
    reason: 'Instant-speed answer to a board wipe or targeted removal for the whole board.'
  - add:
      name: 'Three Visits'
      quantity: 1
      role: ramp
    cut:
      name: 'Courier of Comestibles'
      quantity: 1
    reason: "Same as Nature's Lore; more early ramp means an earlier Kwia."
  - add:
      name: 'Generous Gift'
      quantity: 1
      role: removal
    cut:
      name: 'Liminal Hold'
      quantity: 1
    reason: 'Two-mana instant answer to any permanent instead of a four-mana sorcery-speed enchantment that can be undone.'
  - add:
      name: 'Temple Garden'
      quantity: 1
      role: land
    cut:
      name: 'Hobbit Hole'
      quantity: 1
    reason: 'Untapped green-white dual that Three Visits can fetch (it is a Forest), instead of a land that sacrifices itself for a tapped basic.'
  - add:
      name: 'Brushland'
      quantity: 1
      role: land
    cut:
      name: 'Surveillance Room'
      quantity: 1
    reason: 'Untapped green-white source instead of a colorless land that costs {1} to fix.'
history:
  - date: '2026-11-02'
    notes: >-
      A list review. Tome of Legends rarely gains page counters with a six-mana commander, while Gleaming Splendor is a cheaper repeatable draw outlet. Activated on an opponent's turn after their draw, targeting yourself and them, it draws a card and makes a Treasure, which Peregrin Took and Bilbo turn into Food and more Treasure. The Nature's Lore upgrade now cuts Three Tree Rootweaver.
    changes: '-Tome of Legends, +Gleaming Splendor'
  - date: '2026-11-02'
    notes: >-
      A review of the strongest left-out cards (deck:candidates). Tataru Taru replaces Gallant Citizen: the same two-mana cantrip body, plus a Treasure once each turn when an opponent draws off their turn, which Gleaming Splendor's ability and Tataru's own enter trigger can cause. The Walking Ballista upgrade now cuts Your Fate Ends Here. The other top-20 cards and Bag End Banquet are recorded in considered.
    changes: '-Gallant Citizen, +Tataru Taru'
  - date: '2026-11-02'
    notes: >-
      Two more swaps from the deck:candidates review. Bastion Protector makes Kwia indestructible, so it survives the deck's own Hour of Reckoning; Lightning Greaves goes, since its shroud stops the deck's own protection spells and Swiftfoot Boots stays. Defense of the Heart usually triggers in a four-player game and puts two creatures such as Ghalta and Verdant Kraken, or Peregrin and Bilbo, onto the battlefield; Pictures of Spider-Man goes, as the weaker way to find creatures.
    changes: '-Lightning Greaves, +Bastion Protector, -Pictures of Spider-Man, +Defense of the Heart'
  - date: 2026-11-03
    changes: -Entish Restoration, +Archangel of Thune, -Resolute Reinforcements, +Essence Warden, -Darksteel Mutation, +Beast Within, -Path of Ancestry, +Canopy Vista, -Ash Barrens, +Sunpetal Grove, -Three Tree Rootweaver, +Farseek
    notes: "Swapped out for Archangel of Thune: with every-turn lifegain the Archangel grows the whole token board, and the deck keeps fourteen ramp pieces without it. Swapped out for Essence Warden, which gains life on any player's turn for one mana so Kwia makes a Lotus nearly every turn; Reinforcements makes only one token. Swapped out for Beast Within, an instant answer to any permanent rather than a sorcery-speed creature-only one. Swapped out for Canopy Vista, a green-white dual that usually enters untapped; Path of Ancestry enters tapped and its scry rarely triggers. Swapped out for Sunpetal Grove, an untapped green-white dual instead of a colorless land that costs mana to fix. Swapped out for Farseek: two-mana land ramp whose Plains survives Hour of Reckoning, Settle the Wreckage and opposing wipes, where the dork does not."
  - date: 2026-11-04
    changes: -Farseek, +Nature's Lore, -Make Your Move, +Path to Exile
    notes: "Swapped out for Nature's Lore: the same two-mana land ramp, but the land enters untapped and can be a Forest or a Plains. Swapped out for Path to Exile: one-mana instant exile for any creature instead of a conditional three-mana answer."
  - date: 2026-11-06
    changes: -Web Up, +Seedborn Muse
    notes: "Swapped out for Seedborn Muse: Web Up has the same text as Memory Trap and removal was over the template at 14, while Seedborn untaps every mana source on each opponent's turn so the deck can crack Food and gain life on every turn."
