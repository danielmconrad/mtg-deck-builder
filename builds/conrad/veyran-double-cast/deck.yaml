schema_version: 1
name: Veyran Double Cast
format: commander
status: built
target_bracket: 3
plays_like_bracket: 3
lowest_legal_bracket: 3
power_notes: "Plays like Bracket 3 (Upgraded), mid-range for it. One Game Changer (Fierce Guardianship); fast mana is only Sol Ring plus two-mana rocks and Storm-Kiln Artist's Treasure; no tutors. With Veyran out, Guttersnipe deals 4 to each opponent per instant or sorcery and Thunderdrum Soloist 2 more, so a turn of four or five cheap spells can take a table from about 20, which is fast for a Bracket 3 deck but needs two creatures to survive a turn. No two-card infinite combos: Frantic Search, Rewind and Unwind untap lands but are exiled or used up (Lier gives flashback, which exiles), and no copy effect loops. No extra turns or land denial. 35 lands against Karsten's ~37: the curve is low (twenty 2-drops, seven 1-drops), with 11 ramp pieces, two cost reducers (Goblin Electromancer, Haughty Djinn) and about 14 one- and two-mana cantrips that dig for lands, so two fewer lands is the usual spellslinger trade. Removal is set to 12-16 rather than the template's 10-12 because five of those cards are counterspells that double as protection for the big turn. Weaknesses: only three sweepers (Curse of the Swine, Fulminous Forte and Easy Pickings, all one-sided and small), so go-wide boards and big creatures are a problem; the payoffs are fragile X/2s and 1/1s that die to any wipe; and Veyran at three mana is easy to kill, though the payoffs still work without it at half strength."
notes: "Engine map. Veyran makes every trigger caused by casting or copying an instant or sorcery fire twice, including 'whenever you cast a noncreature spell' triggers. Spells cast produce: cards (Archmage Emeritus, 2 per spell), Treasure (Storm-Kiln Artist, 2 per spell, which is also an artifact for its power), tokens (Young Pyromancer Elementals, Third Path Iconoclast Soldiers, Hermes Birds, Saheeli hasty Thopters, Bothersome Noisemaker Goblin Army, Manaform Hellkite Dragon Illusions), damage to each opponent (Guttersnipe 2, Thunderdrum Soloist 1 or 3, the Mysidian Elder and Lindblum Wizard tokens 1, Caldera Pyremaw growing), and recast value (Baral and Kari Zev free spells, Lier flashback, Torrential Gearhulk, Will of the Jeskai). Copies (Narset's Reversal, Expansion, Choreographed Sparks if added) trigger magecraft (Archmage, Storm-Kiln, Veyran) but not 'whenever you cast' payoffs like Guttersnipe. Cost reducers (Goblin Electromancer, Haughty Djinn) and untap spells (Frantic Search, Rewind, Unwind) turn Treasure into more casts. Mana Geyser, Big Score and Magma Opus (discard for Treasure) fuel the finishing turn with Rolling Thunder, Electrodominance or Explosion. Built 2026-11-03 for game night with no purchases; budget 0."
allow_proxies: false
unlimited_basics: true
primer: 'Izzet spellslinger: Veyran doubles every cast trigger, so cheap instants and sorceries draw two cards (Archmage Emeritus), make two Treasures (Storm-Kiln Artist) and two tokens (Young Pyromancer); chain spells off that mana and win with a big turn of Guttersnipe-style burn and an army of prowess tokens.'
