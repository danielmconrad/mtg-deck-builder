considered:
  - name: "Chemister's Insight"
    reason: 'Draw was well over target; a four-mana draw-two is the slowest draw spell, and a cheap counter (Unwind) protects the combo turn better.'
  - name: 'Whispersilk Cloak'
    reason: 'Boots and Greaves already protect Veyran or Guttersnipe for less; shroud plus unblockable rarely matters for a deck that wins with noncombat damage.'
  - name: 'Relic of Legends'
    reason: 'A three-mana rock; Veyran is the only legend that reliably taps for it, and the deck prefers two-mana rocks and Storm-Kiln Treasure.'
  - name: 'Springleaf Drum'
    reason: 'Taps a token for mana, but it competes with the 1/1s that block and chump; the deck has enough two-mana rocks.'
  - name: 'Curse of Opulence'
    reason: "Gold only when the cursed player is attacked, and this deck rarely attacks; it isn't an instant or sorcery, so Veyran doesn't double it."
  - name: 'Rising of the Day'
    reason: "Haste helps Saheeli's Thopters already, and the deck's payoffs work without attacking; a do-nothing enchantment on its own."
  - name: 'Darksteel Plate'
    reason: 'Indestructible on one creature is good against wipes, but three to cast and two to equip slows the spell chain; Boots and Greaves are cheaper protection.'
  - name: "Irenicus's Vile Duplication"
    reason: 'Copies Guttersnipe or Archmage with flying, but Rite of Replication does the same and makes five when kicked late.'
  - name: 'Crashing Drawbridge'
    reason: 'Grants haste so tokens attack at once, but the deck wins with burn triggers, not combat.'
  - name: 'Millikin'
    reason: 'A colorless mana creature that mills, and milling can bin the instants the deck wants to draw; the two-mana rocks are steadier.'
  - name: 'Coveted Jewel'
    reason: "Six mana, and opponents can steal it by attacking; the deck's ramp is cheap and its big turns come from Treasure and Mana Geyser."
  - name: 'Staff of Compleation'
    reason: 'Pays life for colored mana or for card draw at five mana each; slow and painful next to Guttersnipe-style turns.'
  - name: 'Skirk Prospector'
    reason: "Sacrifices Goblins for mana; only Bothersome Noisemaker's Goblin Army qualifies, which is too few."
  - name: 'Shiny Impetus'
    reason: "Goads an opponent's creature for Treasure on attack; a fine politics card, but it isn't an instant or sorcery and doesn't feed the engine."
  - name: 'Tetsuko Umezawa, Fugitive'
    reason: "Makes the 1/1 tokens unblockable, a real alternate win, but it's a do-nothing two-drop without a board; first in if the burn plan proves too slow."
  - name: 'Run Away Together'
    reason: "Bounces one opponent's creature and one of yours; tempo only, and the deck has better removal."
  - name: 'Quantum Misalignment'
    reason: "Copies a payoff and rebounds for a second copy, but at five mana it's slower than Rite of Replication."
  - name: 'Unstoppable Plan'
    reason: 'Untaps nonland permanents at end step, which only helps the rocks; no instant-or-sorcery value.'
  - name: 'Lithoform Engine'
    reason: 'Copies spells and triggers, but four to cast and three per copy is too much mana for one extra trigger.'
  - name: 'Thirst for Knowledge'
    reason: 'Draw three, discard two with few artifacts to discard; the cheaper cantrips do more for the trigger count.'
  - name: 'Tome of Legends'
    reason: 'Needs the commander to enter or attack; Veyran rarely attacks.'
  - name: 'Laughing Mad'
    reason: 'Two discard-draw casts, but Faithless Looting and Big Score cover the same slot more cheaply.'
  - name: 'Shock'
    reason: 'Cheap trigger plus removal, but two damage is low; first in if the deck wants another one-mana spell.'
  - name: 'Ioreth of the Healing House'
    reason: 'Untaps a rock or a creature; not an instant or sorcery and adds little to the engine.'
  - name: 'Wand of Wonder'
    reason: 'Four to cast and four per activation; too slow.'
  - name: 'Mischievous Mystic'
    reason: "Makes Faeries off the second draw each turn, which Archmage will trigger often, but it's a 1/1 that dies to every sweeper; a fine swap for Bothersome Noisemaker."
  - name: "Soul's Fire"
    reason: 'Fling-style damage depends on a big creature; Caldera Pyremaw is the only one.'
  - name: 'Unsummon'
    reason: 'Tempo bounce only; Fire // Ice and Prismari Command interact better for similar mana.'
  - name: 'Dragonstorm Globe'
    reason: 'A three-mana rock that rewards Dragons; only two in the deck.'
  - name: 'Weathered Sentinels'
    reason: 'A defensive artifact wall; Propaganda does the same job without taking a creature slot.'
  - name: 'Drift of Phantasms'
    reason: 'A defender that transmutes for a three-drop; the tutor would be cute but slow.'
  - name: 'Magic Damper'
    reason: 'A one-mana protection spell that also triggers Veyran; just missed, and a candidate if the payoffs keep dying to spot removal.'
  - name: 'Collective Inferno'
    reason: 'Doubles damage for one creature type; the burn payoffs span Goblin, Dwarf, Dragon and Wizard.'
  - name: 'Magmakin Artillerist'
    reason: "Pings on discard, which the looters trigger, but its trigger isn't an instant-or-sorcery cast, so Veyran doesn't double it."
  - name: 'Mogg War Marshal'
    reason: 'Two Goblins over two turns; not an engine piece.'
  - name: "Peter Parker's Camera"
    reason: 'Copies triggers three times for two each; slow for one extra trigger.'
  - name: 'Smaug the Magnificent'
    reason: 'Deals damage equal to Treasures on attack, but only Storm-Kiln, Big Score and Magma Opus make Treasure; worth trying if Storm-Kiln sticks often.'
  - name: 'Monstrous Rage'
    reason: "A pump spell; the deck doesn't win in combat."
  - name: 'Blazing Crescendo'
    reason: 'Pump plus impulse draw; the cantrips do more.'
  - name: 'Haste Magic'
    reason: 'Pump plus impulse draw; the cantrips do more.'
  - name: 'Temple of the False God'
    reason: 'Colorless and only works at five lands; a two-color deck with double-pip costs wants colored sources.'
  - name: 'Scavenger Grounds'
    reason: 'Colorless; graveyard hate would also turn off Lier, Torrential Gearhulk and Dig Through Time.'
  - name: 'Demolition Field'
    reason: 'Colorless land destruction for one land; not needed.'
  - name: 'Access Tunnel'
    reason: "Colorless; the deck doesn't win by attacking."
  - name: 'Vibrant Cityscape'
    reason: 'Evolving Wilds and Ash Barrens already cover fetches; the basics-only fetch enters tapped.'
  - name: 'Smoldering Crater'
    reason: 'Enters tapped and cycles for two; the deck has enough tapped lands.'
  - name: 'Capital City'
    reason: 'Needs {1} to make colored mana; slow.'
  - name: 'Daily Bugle Building'
    reason: 'Needs {1} to make colored mana; slow.'
  - name: "Mishra's Factory"
    reason: "Colorless; a 2/2 attacker isn't the plan."
  - name: 'Crossroads Village'
    reason: 'Enters tapped for one color; the duals and basics are better.'
  - name: 'Night Market'
    reason: 'Enters tapped for one color; the duals and basics are better.'
upgrades: []
history:
  - date: '2026-11-03'
    notes: "First build from owned cards for game night. Swapped Chemister's Insight for Unwind after the first stats pass: draw was over target and a cheap counter protects the big turn."
    changes: "-Chemister's Insight, +Unwind"
playtests: []
collection_destination: collections/conrad/protected/custom/Veyran Double Cast.txt
