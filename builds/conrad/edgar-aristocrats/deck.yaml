upgrades:
  - add:
      name: Exquisite Blood
      quantity: 1
      role: wincon
    cut:
      name: Authority of the Consuls
      quantity: 1
    reason: 'Combo: with Marauding Blight-Priest or Sanguine Bond, each drain gains life and each gain drains, killing the table. Also turns Bastion and Mirkwood Bats triggers into extra drains.'
  - add:
      name: Sanguine Bond
      quantity: 1
      role: wincon
    cut:
      name: Hop to It
      quantity: 1
    reason: "Combo: a second Exquisite Blood partner, so one removal spell on Blight-Priest doesn't end the plan."
  - add:
      name: Bloodthirsty Conqueror
      quantity: 1
      role: wincon
    cut:
      name: Inside Source
      quantity: 1
    reason: "Combo: a creature copy of Exquisite Blood's effect, pairing with Blight-Priest or Sanguine Bond."
  - add:
      name: Heliod, Sun-Crowned
      quantity: 1
      role: synergy
    cut:
      name: Resolute Reinforcements
      quantity: 1
    reason: 'Combo: with Walking Ballista (lifelink from Heliod) every ping gains life and adds a counter for infinite damage. Also grows Edgar on every lifegain.'
  - add:
      name: Walking Ballista
      quantity: 1
      role: wincon
    cut:
      name: Common Crook
      quantity: 1
    reason: 'Combo: Heliod partner; also a flexible mana sink and removal on its own.'
  - add:
      name: Viscera Seer
      quantity: 1
      role: synergy
    cut:
      name: Unburied Earthcarver
      quantity: 1
    reason: "Free sacrifice outlet with scry, so combos and death triggers don't need mana."
  - add:
      name: Diabolic Intent
      quantity: 1
      role: synergy
    cut:
      name: Night's Whisper
      quantity: 1
    reason: 'Tutor that sacrifices a token as its cost, finding whichever combo piece is missing.'
  - add:
      name: Enlightened Tutor
      quantity: 1
      role: synergy
    cut:
      name: Aerith Rescue Mission
      quantity: 1
    reason: 'Instant-speed tutor for Exquisite Blood, Sanguine Bond or Heliod.'
