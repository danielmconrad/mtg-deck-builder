# yaml-language-server: $schema=../../../schemas/deck.schema.json
schema_version: 1
name: Edgar's Blood Tithe
format: commander
status: draft
bracket: 3
allow_proxies: false
unlimited_basics: true
collection_source:
  - 'collections/conrad/**'
primer: >-
  Orzhov aristocrats. Flood the board with cheap tokens (Lingering Souls, Battle Screech, Hop to It, Champions from Beyond), then feed them to Edgar and the other sacrifice outlets. Every death gains life through Edgar, Daxos and Bastion of Remembrance, and Marauding Blight-Priest turns each lifegain into a drain on every opponent, so the board bleeds the table while Faramir, Braids, Kingpin's Enforcers and Niv-Mizzet refill the hand. Close with a menacing, counter-stacked Edgar, a sacrifice-everything Reprocess or a big Exsanguinate, and reset losing boards with Hour of Reckoning, which spares your tokens.
power_notes: >-
  Bracket 3 (Upgraded) baseline built only from Daniel's binders. No Game Changers (The One Ring is owned but deliberately kept out). No mass land denial, extra turns or two-card infinite combos; it wins by grinding drains. The upgrades add two-card infinite combos (Exquisite Blood with Marauding Blight-Priest or Sanguine Bond, Heliod with Walking Ballista) plus Diabolic Intent and Enlightened Tutor, which make it Bracket 4. Enlightened Tutor is its only Game Changer.
