# yaml-language-server: $schema=../../../schemas/deck.schema.json
schema_version: 1
name: Y'shtola's Night Drain
format: commander
status: draft
bracket: 4
allow_proxies: false
unlimited_basics: false
collection_source:
  - 'collections/conrad/**'
primer: >-
  Esper spells-control. Nearly every noncreature spell costs 3 or more, so each one Y'shtola sees drains every opponent for 2, and two such spells in a turn draw a card at end step. Answer threats with instant-speed removal and counters, refill with Uncover the Moon-Letters Into the Story and Niv-Mizzet, and close with stacked drain engines (Papalymo, Marauding Blight-Priest, the Circle of Power and Transpose Wizards, Fandaniel) and a big Exsanguinate, recasting spells with Emet-Selch and Torrential Gearhulk.
power_notes: >-
  Bracket 4 (Optimized), built only from Daniel's binders (CatLady has been dismantled back into them). Runs one Game Changer (Fierce Guardianship); The One Ring is owned but deliberately kept out. No mass land denial, extra turns or deterministic two-card combos; it wins by grinding drains, so it is on the slower, controlling end of Bracket 4.
