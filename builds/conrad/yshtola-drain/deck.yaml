upgrades:
  - add:
      name: Exquisite Blood
      quantity: 1
      role: wincon, synergy
    cut:
      name: Unstoppable Plan
      quantity: 1
    reason: >-
      Opponents losing life makes you gain that much, which turns every Y'shtola drain into lifegain for Niv-Mizzet and Blight-Priest. With the owned Marauding Blight-Priest (or Sanguine Bond or Vito below) it is a two-card infinite drain, allowed at Bracket 4.
  - add:
      name: Sanguine Bond
      quantity: 1
      role: wincon, synergy
    cut:
      name: Archmage Emeritus
      quantity: 1
    reason: >-
      Every Y'shtola trigger gains 2 life, so this doubles each drain against one opponent, and it is a second Exquisite Blood partner.
  - add:
      name: Vito, Thorn of the Dusk Rose
      quantity: 1
      role: wincon, synergy
    cut:
      name: Lyse Hext
      quantity: 1
    reason: >-
      A cheap creature copy of Sanguine Bond, giving the combo a third partner that also dodges enchantment removal.
  - add:
      name: Toxic Deluge
      quantity: 1
      role: wipe
    cut:
      name: Crux of Fate
      quantity: 1
    reason: >-
      A 3-mana wipe that still triggers Y'shtola and gets around indestructible, replacing a 5-mana one.
  - add:
      name: Anguished Unmaking
      quantity: 1
      role: removal
    cut:
      name: Sephiroth's Intervention
      quantity: 1
    reason: >-
      Instant-speed exile of any nonland permanent for 3, against a creature-only answer that costs 4.
  - add:
      name: Generous Gift
      quantity: 1
      role: removal
    cut:
      name: Your Fate Ends Here
      quantity: 1
    reason: >-
      Answers any permanent, lands included, at instant speed for the same 3 mana.
  - add:
      name: Cryptic Command
      quantity: 1
      role: protection, draw
    cut:
      name: Unwind
      quantity: 1
    reason: >-
      Counters anything (not just noncreature spells) and cantrips or bounces; mana value 4 still drains.
  - add:
      name: Watery Grave
      quantity: 1
      role: land
    cut:
      name: Prairie Stream
      quantity: 1
    reason: >-
      Untapped dual; Prairie Stream often enters tapped with only 14 basics.
  - add:
      name: Godless Shrine
      quantity: 1
      role: land
    cut:
      name: Sunken Hollow
      quantity: 1
    reason: >-
      Untapped dual in place of an unreliable battle land.
  - add:
      name: Hallowed Fountain
      quantity: 1
      role: land
    cut:
      name: Path of Ancestry
      quantity: 1
    reason: >-
      Untapped dual in place of a tapped land.
  - add:
      name: Fabled Passage
      quantity: 1
      role: land
    cut:
      name: Hidden Lair
      quantity: 1
    reason: >-
      Fetches a basic, which turns on the checklands, snarls, Port Town and Bleachbone Verge.
  - add:
      name: Coalition Relic
      quantity: 1
      role: ramp
    cut:
      name: Dependable Quinjet
      quantity: 1
    reason: >-
      Same 3-mana any-color rock (still drains), but it can bank a charge counter for 2 mana on the Y'shtola or wipe turn.
  - add:
      name: Chromatic Lantern
      quantity: 1
      role: ramp
    cut:
      name: Dragonstorm Globe
      quantity: 1
    reason: >-
      Same cost and trigger, and turns every land into a rainbow land, fixing WW/UU/BB costs like Niv-Mizzet, Rewind and Exsanguinate.
  - add:
      name: Thran Dynamo
      quantity: 1
      role: ramp
    cut:
      name: Inherited Envelope
      quantity: 1
    reason: >-
      Mana value 4 still drains, and it makes three mana instead of one, which pays for Gearhulk, Sublime Epiphany and big Exsanguinates.
  - add:
      name: Curiosity
      quantity: 1
      role: draw, synergy
    cut:
      name: Thirst for Knowledge
      quantity: 1
    reason: >-
      The top Y'shtola card per Draftsim: her trigger is damage to each opponent, so on Y'shtola it draws a card per opponent (3 in a four-player game) for every spell costing 3 or more.
  - add:
      name: Tandem Lookout
      quantity: 1
      role: draw, synergy
    cut:
      name: Stock Up
      quantity: 1
    reason: >-
      A second Curiosity effect that survives on a creature: soulbond it with Y'shtola (it pairs when either enters) for a card per opponent each trigger.
