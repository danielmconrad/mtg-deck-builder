  - name: 'Iron Hills'
    quantity: 1
    role: land
  - name: 'Wind-Scarred Crag'
    quantity: 1
    role: land
  - name: 'Dedicated Commons'
    quantity: 1
    role: land
  - name: 'The Lonely Mountain'
    quantity: 1
    role: land
  - name: 'Cori Mountain Monastery'
    quantity: 1
    role: land
  - name: 'Vibrant Cityscape'
    quantity: 1
    role: land
  - name: 'Mountain'
    quantity: 7
    role: land
  - name: 'Plains'
    quantity: 9
