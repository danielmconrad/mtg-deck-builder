upgrades:
  - add:
      name: 'Swords to Plowshares'
      quantity: 1
      role: removal
    cut:
      name: 'Lightning Strike'
      quantity: 1
    reason: 'One-mana unconditional exile, the best removal under the cap; Lightning Strike misses most big threats.'
  - add:
      name: 'Generous Gift'
      quantity: 1
      role: removal
    cut:
      name: 'Abrade'
      quantity: 1
    reason: 'Answers any permanent type, including enchantments and planeswalkers the deck otherwise cannot touch.'
  - add:
      name: 'Fairgrounds Warden'
      quantity: 1
      role: removal,synergy
    cut:
      name: 'Web Up'
      quantity: 1
    reason: 'A Dwarf whose exile trigger Bifur doubles, and a body for Fíli and Kíli triggers.'
  - add:
      name: 'Fearless Skald'
      quantity: 1
      role: synergy
    cut:
      name: 'Iron Hills Stalwart'
      quantity: 1
    reason: 'Cheaper Dwarf whose backup gives an attacker double strike, which stacks well with Equipment.'
  - add:
      name: 'Arcane Signet'
      quantity: 1
      role: ramp
    cut:
      name: 'Hot Dog Cart'
      quantity: 1
    reason: 'Two-mana rock instead of three, so Bifur comes down a turn earlier.'
  - add:
      name: 'Command Tower'
      quantity: 1
      role: land
    cut:
      name: 'Dedicated Commons'
      quantity: 1
    reason: 'Commons almost always enters tapped here (no planeswalkers); Tower is untapped fixing.'
  - add:
      name: 'Path of Ancestry'
      quantity: 1
      role: land
    cut:
      name: 'Wind-Scarred Crag'
      quantity: 1
    reason: 'Same fixing, plus a scry whenever it casts a Dwarf.'
  - add:
      name: 'Clifftop Retreat'
      quantity: 1
      role: land
    cut:
      name: 'Mountain'
      quantity: 1
    reason: 'Untapped dual land in a two-color deck.'
  - add:
      name: 'Furycalm Snarl'
      quantity: 1
      role: land
    cut:
      name: 'Plains'
      quantity: 1
    reason: 'Untapped dual land in a two-color deck.'
playtests: []
