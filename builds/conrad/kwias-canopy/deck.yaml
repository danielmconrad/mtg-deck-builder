# yaml-language-server: $schema=../../../schemas/deck.schema.json
schema_version: 1
name: Kwia's Canopy
format: commander
status: ready
bracket: 3
allow_proxies: false
unlimited_basics: true
collection_source:
  - 'collections/conrad/**'
collection_destination: "collections/conrad/decks/custom/Kwia's Canopy.txt"
primer: >-
  Selesnya reach wall with lifegain ramp. Shut the skies with reach Spiders and beasts (Attercop, Ancient Spider, Old Fat Spider, Spider-Rex, Hazard of the Dunes), reach Equipment and a stack of flyer-only removal, so flying decks can't attack you profitably. Meanwhile gain a little life every turn (Liliana the Faultless, Ajani Resolute, Old Thrush, lifelink creatures, Blossoming Sands) so Kwia makes a Lotus each turn, and use that mana to land big threats early: Ghalta, Wildvine Pummeler, Strength of the Pack. Win by attacking with a wide, oversized ground board backed by Kwia and a few lifelinking flyers, with Settle the Wreckage and Cleansing Nova as resets.
power_notes: >-
  Aimed at Bracket 3 (Upgraded), but the baseline plays closer to a strong Bracket 2: no Game Changers, mass land denial, extra turns or two-card combos, and the efficient staples (Sol Ring, Swords to Plowshares, Path to Exile, Cultivate, Beast Within, Command Tower) are all in Daniel's protected precon decks. The upgrades add cheap ramp, instant-speed removal and a lifegain payoff or two to bring it up to a real Bracket 3.
