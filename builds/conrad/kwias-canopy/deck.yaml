upgrades:
  - add:
      name: 'Sol Ring'
      quantity: 1
      role: ramp
    cut:
      name: 'Germinating Wurm'
      quantity: 1
    reason: 'The best turn-one ramp in the format; a two-mana jump straight into Kwia on turn 4. Your only copies are in protected precons.'
  - add:
      name: 'Swords to Plowshares'
      quantity: 1
      role: removal
    cut:
      name: "Ride's End"
      quantity: 1
    reason: "One-mana instant exile for any creature, including a flyer mid-attack. The life it gives the opponent rarely matters against this deck's lifegain."
  - add:
      name: 'Beast Within'
      quantity: 1
      role: removal
    cut:
      name: 'Fate of the Sun-Cryst'
      quantity: 1
    reason: 'Three-mana instant answer to any permanent, including artifacts, enchantments and planeswalkers the deck otherwise struggles with.'
  - add:
      name: "Nature's Lore"
      quantity: 1
      role: ramp
    cut:
      name: 'Scout the Wilderness'
      quantity: 1
    reason: 'Two-mana untapped land drop instead of three; fetches Canopy Vista too.'
  - add:
      name: 'Farseek'
      quantity: 1
      role: ramp
    cut:
      name: 'Studious First-Year // Rampant Growth'
      quantity: 1
    reason: 'Two-mana ramp that fetches a Plains or Canopy Vista, fixing white for the WW in Kwia.'
  - add:
      name: 'Essence Warden'
      quantity: 1
      role: synergy
    cut:
      name: 'Old Thrush'
      quantity: 1
    reason: "Gains life whenever any creature enters, on every player's turn, so Kwia makes a Lotus nearly every turn around the table."
  - add:
      name: 'Heroic Intervention'
      quantity: 1
      role: protection
    cut:
      name: 'Take Up the Shield'
      quantity: 1
    reason: 'Protects the whole board (hexproof and indestructible) from wipes and removal, not just one creature.'
  - add:
      name: 'Command Tower'
      quantity: 1
      role: land
    cut:
      name: 'Crossroads Village'
      quantity: 1
    reason: 'Untapped land for both colors instead of a tapped one.'
  - add:
      name: 'Sunpetal Grove'
      quantity: 1
      role: land
    cut:
      name: 'Vibrant Cityscape'
      quantity: 1
    reason: 'Usually untapped dual land instead of a slow fetch.'
  - add:
      name: 'Canopy Vista'
      quantity: 1
      role: land
    cut:
      name: 'Plains'
      quantity: 1
    reason: "Dual land with basic types, so Farseek and Nature's Lore can fetch it."
  - add:
      name: 'Archangel of Thune'
      quantity: 1
      role: synergy
    cut:
      name: 'Phantom Flock'
      quantity: 1
    reason: 'The lifegain payoff the deck lacks: a lifelinking flyer that puts a +1/+1 counter on every creature you control whenever you gain life, so each lifegain that makes a Lotus also pumps the team.'
  - add:
      name: 'Path to Exile'
      quantity: 1
      role: removal
    cut:
      name: 'Radiant Strike'
      quantity: 1
    reason: 'One-mana instant exile instead of a four-mana answer that only hits tapped creatures.'
playtests: []
