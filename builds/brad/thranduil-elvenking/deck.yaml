upgrades:
  - add:
      name: 'Sol Ring'
      quantity: 1
      role: ramp
    cut:
      name: 'Encroaching Dragonstorm'
      quantity: 1
    reason: 'Turn-one acceleration toward a turn-three or turn-four Thranduil.'
  - add:
      name: 'Arcane Signet'
      quantity: 1
      role: ramp
    cut:
      name: 'Emergent Sequence'
      quantity: 1
    reason: 'Two-mana rock that makes all three colors.'
  - add:
      name: 'Command Tower'
      quantity: 1
      role: land
    cut:
      name: 'Kishla Village'
      quantity: 1
    reason: 'Untapped land for all three colors.'
  - add:
      name: 'Opulent Palace'
      quantity: 1
      role: land
    cut:
      name: 'Jungle Hollow'
      quantity: 1
    reason: 'Three colors instead of two from the same tapped land.'
  - add:
      name: 'Zagoth Triome'
      quantity: 1
      role: land
    cut:
      name: 'Foggy Bottom Swamp'
      quantity: 1
    reason: 'Three-color land that also cycles away late.'
  - add:
      name: 'Priest of Titania'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Mirkwood Pathmaker'
      quantity: 1
    reason: 'Taps for one green per Elf, and once in the graveyard Thranduil does the same.'
  - add:
      name: 'Elvish Archdruid'
      quantity: 1
      role: ramp, synergy, wincon
    cut:
      name: 'Lys Alana Informant'
      quantity: 1
    reason: 'Lord that taps for one green per Elf; Thranduil copies the mana ability from the graveyard.'
  - add:
      name: 'Llanowar Elves'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Elven Raft-Steerer'
      quantity: 1
    reason: 'A second one-mana mana Elf for faster starts.'
  - add:
      name: 'Fyndhorn Elves'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Scarblade Scout'
      quantity: 1
    reason: 'A third one-mana mana Elf; Thranduil borrows its tap ability from the graveyard.'
  - add:
      name: 'Elvish Harbinger'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Cache Grab'
      quantity: 1
    reason: 'Puts any Elf (such as a legendary one) on top, then taps for any color.'
  - add:
      name: 'Skullclamp'
      quantity: 1
      role: draw
    cut:
      name: 'Stoic Grove-Guide'
      quantity: 1
    reason: 'Elf tokens and spent mana Elves become two cards each, and the Elves go to the graveyard for Thranduil.'
  - add:
      name: 'Beast Within'
      quantity: 1
      role: removal
    cut:
      name: 'Shattered Wings'
      quantity: 1
    reason: 'Instant answer to any permanent, not just fliers and artifacts.'
