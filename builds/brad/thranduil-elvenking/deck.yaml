# yaml-language-server: $schema=../../../schemas/deck.schema.json
schema_version: 1
name: Halls of the Elvenking
format: commander
status: draft
bracket: 3
allow_proxies: false
unlimited_basics: true
collection_source:
  - 'collections/brad/*'
primer: >-
  Fill the graveyard with Elves whose activated abilities Thranduil then uses himself (Circle of Dreams Druid mana, Guardian of the Halls counters, Elvenking's Harper evasion, Iron-Shield Elf indestructibility), while every other legendary Elf that enters draws two cards. Ramp with mana Elves, then win with a huge, unblockable Thranduil or a wide Elf board under Morcant's Loyalist, Thranduil, Sindarin Liege and Moon-Vigil Adherents.
power_notes: >-
  Bracket 3 (Upgraded). Built only from BradsCollection's "all cards" binder with the commonest staples (Sol Ring, Arcane Signet, Command Tower) tied up in Brad's other decks, so it plays nearer an upgraded precon until the upgrades go in. No mass land denial, extra turns or two-card combos.
notes: >-
  Brad's deck, built only from his collection (see collections).
budget:
  amount: 100
  currency: USD
