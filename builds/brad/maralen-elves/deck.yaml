upgrades:
  - add:
      name: 'Sol Ring'
      quantity: 1
      role: ramp
    cut:
      name: 'Summon: Fenrir'
      quantity: 1
    reason: 'Turn-one acceleration toward a turn-three or turn-four Maralen.'
  - add:
      name: 'Arcane Signet'
      quantity: 1
      role: ramp
    cut:
      name: 'Emergent Sequence'
      quantity: 1
    reason: 'Two-mana rock that makes all three colors.'
  - add:
      name: "Nature's Lore"
      quantity: 1
      role: ramp
    cut:
      name: 'Tend the Sprigs'
      quantity: 1
    reason: 'Puts a Forest into play untapped for two mana, and it finds a Triome.'
  - add:
      name: 'Command Tower'
      quantity: 1
      role: land
    cut:
      name: 'Kishla Village'
      quantity: 1
    reason: 'Untapped land for all three colors.'
  - add:
      name: 'Opulent Palace'
      quantity: 1
      role: land
    cut:
      name: 'Jungle Hollow'
      quantity: 1
    reason: 'Three colors instead of two from the same tapped land.'
  - add:
      name: 'Zagoth Triome'
      quantity: 1
      role: land
    cut:
      name: 'Foggy Bottom Swamp'
      quantity: 1
    reason: 'Three-color land that also cycles away late.'
  - add:
      name: 'Llanowar Elves'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Mirkwood Pathmaker'
      quantity: 1
    reason: "A second one-mana mana Elf, which counts toward Maralen's free-spell cap."
  - add:
      name: 'Elvish Archdruid'
      quantity: 1
      role: ramp, synergy, wincon
    cut:
      name: 'Lys Alana Informant'
      quantity: 1
    reason: 'Lord that taps for one green per Elf; huge mana with a wide board.'
  - add:
      name: 'Heritage Druid'
      quantity: 1
      role: ramp, synergy
    cut:
      name: 'Glamermite'
      quantity: 1
    reason: 'Turns three summoning-sick Elves into three mana for explosive turns.'
  - add:
      name: 'Elvish Warmaster'
      quantity: 1
      role: synergy, wincon
    cut:
      name: 'Elven Raft-Steerer'
      quantity: 1
    reason: 'Makes an Elf token whenever another Elf enters; each token also triggers Maralen.'
  - add:
      name: 'Beast Whisperer'
      quantity: 1
      role: draw, synergy
    cut:
      name: 'Stoic Grove-Guide'
      quantity: 1
    reason: 'Draws a card on every creature spell, repeatable card advantage.'
  - add:
      name: 'Skullclamp'
      quantity: 1
      role: draw
    cut:
      name: "Morcant's Eyes"
      quantity: 1
    reason: 'Elf and changeling tokens become two cards each.'
  - add:
      name: 'Beast Within'
      quantity: 1
      role: removal
    cut:
      name: 'Shattered Wings'
      quantity: 1
    reason: 'Instant answer to any permanent, not just fliers and artifacts.'
