# yaml-language-server: $schema=../../../schemas/deck.schema.json
schema_version: 1
name: Avacyn's Endless Night
format: commander
status: draft
target_bracket: 3
plays_like_bracket: 3
lowest_legal_bracket: 3
allow_proxies: false
unlimited_basics: true
collection_source:
  - 'collections/brad/*'
primer: >-
  Avacyn returns every nontoken creature of yours that dies at the beginning of the next end step, so the deck is built from creatures whose enter or death triggers are worth repeating: symmetrical edicts (Accursed Marauder, Chain Devil) that become one-sided, removal on a body (Azog, Elektra, Lamentation, Noxious Gearhulk, Archive Arbiter), drains (Gollum the Abandoned, Vampire Spawn, Cat-Gator), discard, Treasure and a repeatable tutor in Grim Servant. Free sacrifice outlets and sacrifice-as-cost removal let you loop them on every player's turn while Agent Venom, Massacre Girl and Al Bhed Salvagers turn each death into cards and damage. Villainous Wrath and The Echoverse Fulcrum become one-sided wipes with Avacyn out. Ramp hard to reach her eight mana; she returns herself when she dies, so leave her in the graveyard rather than paying commander tax.
power_notes: >-
  Plays like Bracket 3 (Upgraded). One Game Changer (Orcish Bowmasters) and no two-card combos, mass land denial or extra turns. Built only from Brad's "all cards" binder: the black aristocrats staples he owns (Blood Artist, Zulaport Cutthroat, Viscera Seer, Carrion Feeder, Gray Merchant, Skullclamp, Sol Ring, Arcane Signet, Dark Ritual) are all in his other decks, so the mana is slower and the drain payoffs thinner than the plan deserves.
notes: >-
  Brad's deck, built only from his collection (see collection_source).
