primer: '60-card Commander with every card at $1 or less (cheapest printing). Ultimate Green Goblin makes you discard every upkeep and pays you a Treasure; the deck turns those discards into value with mayhem and madness cards cast from the graveyard and discard payoffs (Marauding Mako, Magmakin Artillerist, Cryptcaller Chariot, Hobgoblin). Treasure sacrifices feed Mayhem Devil, and a Villain sub-theme (Tombstone, Crossbones, Shriek) adds reach.'
power_notes: 'Bracket 2. No Game Changers, tutors or combos. The upkeep discard is mandatory, so keep cheap draw flowing.'
