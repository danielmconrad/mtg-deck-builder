upgrades:
  # Staples: owned copies are all in Precons, so these are new purchases
  - add:
      name: Sol Ring
      quantity: 1
      role: ramp
    cut:
      name: Giant's Boulder
      quantity: 1
    reason: Best turn-1 ramp; Giant's Boulder is the weakest mana rock.
  - add:
      name: Swords to Plowshares
      quantity: 1
      role: removal
    cut:
      name: Ride's End
      quantity: 1
    reason: One-mana instant exile; Ride's End is only cheap against tapped creatures.
  - add:
      name: Path to Exile
      quantity: 1
      role: removal
    cut:
      name: Fate of the Sun-Cryst
      quantity: 1
    reason: Cheap instant-speed exile; the deck's removal is mostly sorcery-speed.
  - add:
      name: Command Tower
      quantity: 1
      role: land
    cut:
      name: Night Market
      quantity: 1
    reason: Untapped dual source instead of a tapped one-color land.
  # Card draw, the weakest role
  - add:
      name: Mentor of the Meek
      quantity: 1
      role: draw
    cut:
      name: Errand-Rider of Gondor
      quantity: 1
    reason: Repeatable draw off cheap Dwarves and Dwarf tokens instead of a one-shot cantrip.
  - add:
      name: Idol of Oblivion
      quantity: 1
      role: draw
    cut:
      name: Racers' Scoreboard
      quantity: 1
    reason: Thorin's Treasures turn on its draw every turn; Scoreboard is a one-time card.
  # Dwarf and Treasure payoffs
  - add:
      name: Magda, Brazen Outlaw
      quantity: 1
      role: synergy, ramp
    cut:
      name: Pillardrop Warden
      quantity: 1
    reason: A Dwarf lord that makes Treasure, replacing the weakest Dwarf.
  - add:
      name: Professional Face-Breaker
      quantity: 1
      role: ramp, draw
    cut:
      name: Stark Industries Executive
      quantity: 1
    reason: Makes Treasure from combat and turns Treasure into cards, with no mana tax.
  - add:
      name: Chaos Warp
      quantity: 1
      role: removal
    cut:
      name: Heated Debate
      quantity: 1
    reason: Instant answer to any permanent type, not just creatures.
  # Mana base
  - add:
      name: Sacred Foundry
      quantity: 1
      role: land
    cut:
      name: Crossroads Village
      quantity: 1
    reason: Untapped dual instead of a tapped one-color land.
  - add:
      name: Inspiring Vantage
      quantity: 1
      role: land
    cut:
      name: Dedicated Commons
      quantity: 1
    reason: Dedicated Commons almost always enters tapped without planeswalkers.
  - add:
      name: Clifftop Retreat
      quantity: 1
      role: land
    cut:
      name: Mountain
      quantity: 1
    reason: Adds a white source without losing a red one.
playtests: []
