upgrades:
  - add:
      name: 'Sol Ring'
      quantity: 1
      role: ramp
    cut:
      name: 'Worn Powerstone'
      quantity: 1
    reason: 'Two mana on turn one instead of a tapped rock on turn three.'
  - add:
      name: 'Arcane Signet'
      quantity: 1
      role: ramp
    cut:
      name: 'Boros Keyrune'
      quantity: 1
    reason: 'Two-mana rock that fixes both colors, a mana cheaper than the Keyrune.'
  - add:
      name: 'Talisman of Conviction'
      quantity: 1
      role: ramp
    cut:
      name: 'Boros Cluestone'
      quantity: 1
    reason: 'Two-mana untapped red-white rock instead of a three-mana one.'
  - add:
      name: 'Command Tower'
      quantity: 1
      role: land
    cut:
      name: 'Surveillance Room'
      quantity: 1
    reason: 'Untapped land that taps for either color instead of a filter land.'
  - add:
      name: 'Sacred Foundry'
      quantity: 1
      role: land
    cut:
      name: 'Dedicated Commons'
      quantity: 1
    reason: 'Untapped dual that also counts as a Mountain for The Lonely Mountain.'
  - add:
      name: 'Inspiring Vantage'
      quantity: 1
      role: land
    cut:
      name: 'Monumental Henge'
      quantity: 1
    reason: 'Untapped dual early, when the cheap Equipment needs both colors.'
  - add:
      name: 'Lightning Greaves'
      quantity: 1
      role: protection, synergy
    cut:
      name: 'Dragonfire Blade'
      quantity: 1
    reason: 'Free to equip, so it protects and hastes Bruenor or a carrier the turn it lands.'
  - add:
      name: 'Swiftfoot Boots'
      quantity: 1
      role: protection, synergy
    cut:
      name: "Medic's Kitesail"
      quantity: 1
    reason: 'Hexproof and haste for the key creature; better than a small flying boost.'
  - add:
      name: 'Puresteel Paladin'
      quantity: 1
      role: draw, synergy
    cut:
      name: 'Item Shopkeep'
      quantity: 1
    reason: 'Draws on every Equipment cast and, with three artifacts, makes every equip cost 0.'
  - add:
      name: "Sigarda's Aid"
      quantity: 1
      role: synergy
    cut:
      name: 'Armory Veteran'
      quantity: 1
    reason: 'Flash in Equipment and auto-attach it, so removal and combat tricks miss.'
  - add:
      name: 'Stoneforge Mystic'
      quantity: 1
      role: synergy
    cut:
      name: 'Prophetic Prism'
      quantity: 1
    reason: 'Tutors the best Equipment (Jitte, Andúril) and can put it into play.'
  - add:
      name: 'Skullclamp'
      quantity: 1
      role: draw
    cut:
      name: 'Eye of Vecna'
      quantity: 1
    reason: "Turns small creatures and the deck's Equipment tokens into two cards each."
  - add:
      name: 'Swords to Plowshares'
      quantity: 1
      role: removal
    cut:
      name: 'Your Fate Ends Here'
      quantity: 1
    reason: 'One-mana instant exile with no restriction on the target.'
  - add:
      name: 'Path to Exile'
      quantity: 1
      role: removal
    cut:
      name: 'Harsh Annotation'
      quantity: 1
    reason: 'One-mana instant exile instead of two-mana removal that leaves a flier behind.'
